<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4f6b">
  <meta name="description" content="CoreMesh Connect: Unterlagen, Aushänge und Nachrichten Ihrer Verwaltung">
  <title>CoreMesh Connect</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app"><p class="laden">Lade …</p></div>
  <script type="module" src="nav.js"></script>
  <script type="module" src="melden.js"></script>
  <script type="module" src="pdfview.js"></script>
  <script type="module">
    import init, { boot, alarm_melden } from './pkg/pwa/pwa.js';
    // Signierte App (export 0.18.0): Schlüssel an den Service Worker, Meldungen zurück an die App
    window.cm1Sicherheit = {
      vertrauen(keys) {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.ready.then((r) => {
          if (!r.active) return;
          r.active.postMessage({ art: 'cm1-vertrauen', keys: JSON.parse(keys) });
          r.active.postMessage({ art: 'cm1-alarme' });
        }).catch(() => {});
      },
    };
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', (ev) => {
        const d = ev.data || {};
        if (d.art === 'cm1-alarm') alarm_melden(JSON.stringify(d.alarme || [])).catch(console.error);
        if (d.art === 'cm1-app-neu' && !document.querySelector('.app-neu')) {
          const p = document.createElement('p');
          p.className = 'status app-neu';
          p.innerHTML = 'Eine neue, geprüfte Fassung der App ist bereit. <button class="ghost">Neu laden</button>';
          p.querySelector('button').addEventListener('click', () => location.reload());
          document.getElementById('app').prepend(p);
        }
      });
    }
    try {
      await init();
      await boot(document.getElementById('app'));
    } catch (e) {
      document.getElementById('app').innerHTML =
        '<main class="einrichten"><h1>Fehler</h1><p class="status">' + String(e) + '</p></main>';
      console.error(e);
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
      navigator.serviceWorker.ready.then((r) => r.active && r.active.postMessage('fuellen')).catch(() => {});
    }
  </script>
</body>
</html>
