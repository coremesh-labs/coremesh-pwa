[package]
name = "vorgang"
description = "Modul „Vorgänge“ der Ablage-PWA: zeigt Vorgänge als Objektdaten (process/1), Rust → WASM"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Nur Modelle: das Modul sieht keine Schlüssel.
cm1 = { path = "../cm1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob", "BlobPropertyBag", "Url", "Window", "Document", "HtmlElement", "Element",
    "Event", "EventTarget", "HtmlInputElement", "HtmlSelectElement",
] }
