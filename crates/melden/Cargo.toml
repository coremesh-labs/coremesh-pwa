[package]
name = "melden"
description = "Modul „Melden“ der App CoreMesh Connect: Anliegen mit Texten, Bildern und PDFs an die Verwaltung, Rust → WASM"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "Element",
    "Event", "EventTarget", "FileList", "File", "Blob", "ImageBitmap", "HtmlCanvasElement",
    "CanvasRenderingContext2d", "Crypto",
] }
