[package]
name = "pwa"
description = "Hülle der Ablage-PWA: Einrichten, Startdatei, Schlüssel, Module laden (Rust → WASM)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cm1 = { path = "../cm1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Zufall für age im Browser (getrandom 0.2 braucht im WASM-Target das Feature „js“).
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Location", "History", "Storage",
    "Request", "RequestInit", "Headers", "RequestCache", "Response",
    "Blob", "BlobPropertyBag", "Url",
    "HtmlElement", "HtmlAnchorElement", "HtmlInputElement", "Element", "Event", "EventTarget",
] }
