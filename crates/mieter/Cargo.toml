[package]
name = "mieter"
description = "Modul „Mieter“ der Ablage-PWA: Mietverhältnis (tenant/1) und Haus (property/1), Rust → WASM"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Nur Modelle: das Modul sieht keine Schlüssel.
cm1 = { path = "../cm1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob", "BlobPropertyBag", "Url", "Window", "Document", "HtmlElement", "Element",
    "Event", "EventTarget", "Navigator",
] }
